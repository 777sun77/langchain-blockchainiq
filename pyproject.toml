[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langchain-blockchainiq"
version = "0.1.0"
description = "Blockchain IQ x402 v2 tools for Langchain"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Sihu Park"}]
dependencies = ["langchain-core>=1.0,<2", "x402[evm,httpx]==2.25.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_blockchainiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
